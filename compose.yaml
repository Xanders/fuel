services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel_test
      POSTGRES_DB: fuel_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fuel -d fuel_test]
      interval: 1s
      retries: 30
  test:
    image: crystallang/crystal:1.22.1-alpine@sha256:9beda8a9d4a3659c29d185cc18f3fb9b382421bb6a4a59b8f266a6fb4ccc9f16
    working_dir: /work
    volumes:
      - .:/work
      - shards:/work/lib
      - crystal-cache:/root/.cache/crystal
    environment:
      FUEL_TEST_DATABASE_URL: postgres://fuel:fuel_test@db:5432/fuel_test
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "shards install && crystal spec"]
networks:
  default:
    ipam:
      config:
        - subnet: ${FUEL_TEST_SUBNET:-10.203.82.0/24}
volumes:
  shards:
  crystal-cache:
